name: Feedback / feature request
description: Share feedback or suggest an improvement
title: "[Feedback] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PhraseLock! Please check the [roadmap](https://github.com/nanana677777/phraselock/blob/main/TODO.md) first, your idea may already be planned.
  - type: dropdown
    id: type
    attributes:
      label: What kind of feedback is this?
      options:
        - New feature idea
        - Improvement to an existing feature
        - Usability / design
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea, and the problem it solves for you.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you tried or considered instead.
  - type: input
    id: version
    attributes:
      label: PhraseLock version (optional)
      placeholder: v1.0.1
