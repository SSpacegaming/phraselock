name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pywin32 pillow pyinstaller psutil
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build single PhraseLock.exe
        run: pyinstaller --noconfirm --clean --onefile --noconsole --noupx --name PhraseLock --icon icon.ico --hidden-import settings --hidden-import PhraseLockWatchdog --hidden-import win32timezone phrase_lock.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhraseLock-windows
          path: dist/PhraseLock.exe
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/PhraseLock.exe --generate-notes
